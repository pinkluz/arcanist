name: Build
on:
  workflow_dispatch:
    inputs:
      greenlight_version:
        description: Release candidate version
        required: false
        type: string
      greenlight_commit_sha:
        description: Commit to build
        required: false
        type: string

env:
  VERSION: ${{ inputs.greenlight_version || format('dev-{0}', github.run_number) }}

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.greenlight_commit_sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.greenlight_commit_sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  # Same platform list as release.sh, plus darwin_arm64, built as static
  # binaries with the plain Go toolchain (equivalent output to the bazel
  # build, without pinning a bazel version in CI).
  binaries:
    runs-on: ubuntu-latest
    needs: [vet, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd,  goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.greenlight_commit_sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build arc
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o "arc_${GOOS}_${GOARCH}" ./cmd/arc
      - uses: actions/upload-artifact@v4
        with:
          name: arc-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: arc_${{ matrix.goos }}_${{ matrix.goarch }}
          retention-days: 30
