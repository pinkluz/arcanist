name: Tests
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      greenlight_version:
        required: false
        type: string
      greenlight_commit_sha:
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.greenlight_commit_sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
