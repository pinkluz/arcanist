name: Deploy production
on:
  workflow_dispatch:
    inputs:
      greenlight_version:
        required: false
        type: string
      greenlight_commit_sha:
        required: false
        type: string

# Ship-readiness gate: every release platform must build from the exact
# pinned commit before the release can go live. Binaries get attached to the
# GitHub release by release-assets.yml once greenlight publishes it.
jobs:
  ship-check:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd,  goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.greenlight_commit_sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build arc
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o "arc_${GOOS}_${GOARCH}" ./cmd/arc
