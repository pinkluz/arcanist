name: Security scan
on:
  workflow_dispatch:
    inputs:
      greenlight_version:
        required: false
        type: string
      greenlight_commit_sha:
        required: false
        type: string
  schedule:
    - cron: '0 6 * * 1'

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.greenlight_commit_sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
